name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: streamflix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: streamflix/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Build (TypeScript + Vite)
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN || 'test_token' }}
        run: npm run build
